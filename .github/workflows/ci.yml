name: HERABRIUM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Keep each main-branch validation run alive; do not cancel a previous
# successful/active validation just because another commit arrives.
concurrency:
  group: herabrium-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run typecheck
      - name: Vite production build
        run: npm run build
      - name: Verify Phase 6 Nexus feature contract
        run: |
          python - <<'PY'
          from pathlib import Path

          nexus = Path("src/components/HerabriumNexus.tsx").read_text()
          app = Path("src/App.tsx").read_text()
          required_nexus = [
              "NEXUS COMMAND",
              "Promise.allSettled",
              "OCCURRENCE CHRONOLOGY",
              "Publication stream",
              "PROVENANCE REGISTRY",
              "NEXUS DOSSIER VAULT",
              "herabrium-nexus-dossiers-v1",
              "Export JSON",
              "Export report",
              "follow-up",
              "year_from",
              "open_access_only",
          ]
          missing = [feature for feature in required_nexus if feature not in nexus]
          if missing:
              raise SystemExit("Missing Nexus feature markers: " + ", ".join(missing))
          if 'from "./components/HerabriumNexus"' not in app or 'navigate("nexus")' not in app:
              raise SystemExit("HERABRIUM Nexus is not imported and navigable from App.tsx")
          print("Phase 6 feature contract passed: multi-domain orchestration, chronology, literature, provenance, dossier vault, notes/status and exports.")
          PY

  api:
    name: Backend syntax and application import
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Compile every backend module
        run: python -m compileall -q backend
      - name: Import FastAPI application and verify registered routes
        run: |
          python - <<'PY'
          from backend.main import app

          routes = {getattr(route, "path", "") for route in app.routes}
          required = {
              "/health",
              "/api/v1/research/query",
              "/api/v1/phytoevidence/health",
              "/api/v1/phytoevidence/search",
          }
          missing = sorted(required - routes)
          if missing:
              raise SystemExit("Missing API routes: " + ", ".join(missing))
          print("Backend import and Phase 1–6 API route registration passed.")
          PY
