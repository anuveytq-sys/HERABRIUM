name: HERBARIUM Phase 1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Do not cancel a running validation job when another commit arrives.
# GitHub Actions may retain only the newest pending run in a concurrency group,
# so wait for each run to finish before pushing another main-branch commit.
concurrency:
  group: herbarium-main-ci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m py_compile backend/main.py
