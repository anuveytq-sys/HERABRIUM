name: PhytoEvidence live verification

on:
  push:
    branches: [main]
    paths:
      - "backend/phytoevidence.py"
      - "src/components/PhytoEvidenceLab.tsx"
      - "src/App.tsx"
      - ".github/workflows/phytoevidence-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify live Phase 5 API
        env:
          BASE_URL: https://herbarium-intelligence.vercel.app
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base = os.environ["BASE_URL"].rstrip("/")
          health_url = base + "/api/v1/phytoevidence/health"
          for attempt in range(18):
              try:
                  with urllib.request.urlopen(health_url, timeout=12) as response:
                      health = json.loads(response.read().decode())
                  if health.get("status") == "ready":
                      break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit("PhytoEvidence health endpoint did not become ready")
          payload = json.dumps({"query":"mangrove biodiversity","open_access_only":False}).encode()
          request = urllib.request.Request(base + "/api/v1/phytoevidence/search", data=payload, headers={"Content-Type":"application/json","Accept":"application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=20) as response:
              data = json.loads(response.read().decode())
          assert data.get("query") == "mangrove biodiversity", data
          assert isinstance(data.get("works"), list), data
          assert data.get("source") == "OpenAlex public scholarly metadata API", data
          assert isinstance(data.get("warnings"), list) and data["warnings"], data
          assert data.get("source_status") in {"ready", "temporarily_unavailable"}, data
          assert all("title" in item and "study_type" in item and "url" in item for item in data["works"]), data
          if data["source_status"] == "temporarily_unavailable":
              print("PHYTOEVIDENCE DEGRADED MODE PASS")
              print("OpenAlex outage is surfaced without breaking the research workspace.")
          else:
              print("PHYTOEVIDENCE LIVE PASS")
              print("Matched:", data.get("total_matched"))
              print("Returned eligible records:", data.get("returned"))
              print("With abstracts:", data.get("coverage", {}).get("with_abstract"))
              print("Study categories:", ", ".join(data.get("coverage", {}).get("classified_types", [])))
          PY
