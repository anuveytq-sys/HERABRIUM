name: Research Bridge Live Smoke Test
# Production contract covers all five Nexus domains and OpenAlex-to-Crossref fallback.

on:
  push:
    branches: [main]
    paths:
      - "backend/research_bridge.py"
      - "backend/phytoevidence.py"
      - "backend/main.py"
      - "src/components/ResearchBridgePanel.tsx"
      - "src/components/Phase4BiodiversityExplorer.tsx"
      - "src/components/PhytoEvidenceLab.tsx"
      - "src/components/HerabriumNexus.tsx"
      - "src/App.tsx"
      - "vercel.json"
      - ".github/workflows/research-bridge-live-smoke.yml"
  workflow_dispatch:

jobs:
  live-research-query:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for the updated production bridge
        env:
          BASE_URL: https://herbarium-intelligence.vercel.app
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl -sS -o /tmp/bridge-health.json -w "%{http_code}" "$BASE_URL/api/v1/research/health" || true)
            if [ "$status" = "200" ] && grep -q '"bridge":"ready"' /tmp/bridge-health.json; then
              cat /tmp/bridge-health.json
              exit 0
            fi
            echo "Waiting for updated production bridge (attempt $attempt/60, HTTP $status)"
            sleep 5
          done
          echo "Updated production bridge did not become available."
          exit 1

          
      - name: Allow the production deployment to finish propagating
        run: sleep 45

      - name: Submit a real production research query
        env:
          BASE_URL: https://herbarium-intelligence.vercel.app
        run: |
          curl --fail-with-body --silent --show-error --max-time 40 \
            -X POST "$BASE_URL/api/v1/research/query" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"query":"Ganga dolphin","section":"biosphere"}' \
            -o /tmp/research-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/research-result.json").read_text())
          assert result.get("query") == "Ganga dolphin", result
          assert result.get("section") == "biosphere", result
          assert isinstance(result.get("overview"), str) and result["overview"], result
          assert isinstance(result.get("occurrences"), list), result
          assert isinstance(result.get("warnings"), list), result
          taxon = result.get("taxon") or {}
          assert "platanista gangetica" in (taxon.get("scientific_name") or "").casefold(), result
          print("LIVE RESEARCH BRIDGE PASS")
          print("Accepted taxon:", taxon.get("scientific_name"))
          print("Indexed occurrences:", result.get("occurrence_summary", {}).get("total_indexed_records"))
          print("Returned occurrence sample:", len(result.get("occurrences", [])))
          print("Related knowledge:", len(result.get("related_knowledge", [])))
          print("Publication candidates:", len(result.get("literature_candidates", [])))
          PY

      - name: Verify all five Nexus research domains
        env:
          BASE_URL: https://herbarium-intelligence.vercel.app
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          base = os.environ["BASE_URL"]
          for section in ("intelligence", "ethno", "specimen", "biosphere", "conservation"):
              body = json.dumps({"query": "Neem", "section": section})
              raw = subprocess.check_output([
                  "curl", "--fail-with-body", "--silent", "--show-error",
                  "--max-time", "40", "-X", "POST",
                  base + "/api/v1/research/query",
                  "-H", "Content-Type: application/json",
                  "--data", body
              ], text=True)
              result = json.loads(raw)
              assert result.get("query") == "Neem", (section, result)
              assert result.get("section") == section, (section, result)
              assert isinstance(result.get("overview"), str) and result["overview"], (section, result)
              assert isinstance(result.get("section_insights"), list), (section, result)
              assert isinstance(result.get("sources"), list), (section, result)
              print("NEXUS DOMAIN PASS:", section, "| insights:", len(result["section_insights"]), "| sources:", len(result["sources"]))
          PY

      - name: Verify Phase 5 publication discovery used by Nexus
        env:
          BASE_URL: https://herbarium-intelligence.vercel.app
        run: |
          curl --fail-with-body --silent --show-error --max-time 40 \
            -X POST "$BASE_URL/api/v1/phytoevidence/search" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"query":"botanical biodiversity survey"}' \
            -o /tmp/phytoevidence-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/phytoevidence-result.json").read_text())
          assert result.get("query") == "botanical biodiversity survey", result
          assert isinstance(result.get("works"), list), result
          assert isinstance(result.get("total_matched"), int), result
          assert isinstance(result.get("warnings"), list), result
          assert result.get("review_required") is True, result
          assert result.get("source_status") in {"ready", "fallback", "temporarily_unavailable"}, result
          if result["source_status"] == "temporarily_unavailable":
              print("PHYTOEVIDENCE DEGRADED MODE PASS: both indexes are unavailable; Nexus remains usable.")
              print("Warnings:", result["warnings"])
          elif result["source_status"] == "fallback":
              print("PHYTOEVIDENCE CROSSREF FALLBACK PASS")
              print("Matched:", result["total_matched"], "| returned:", len(result["works"]))
          else:
              print("PHYTOEVIDENCE OPENALEX LIVE PASS")
              print("Matched:", result["total_matched"], "| returned:", len(result["works"]))
          PY
